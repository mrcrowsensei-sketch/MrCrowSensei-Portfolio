<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr CrowSensei - Admin</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  width:90%;
  max-width:400px;
  padding:30px;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  box-sizing:border-box;
}

h1{
  text-align:center;
  margin-top:0;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

#message{
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">
  <h1>Mr CrowSensei</h1>
  <p style="text-align:center;">Admin Login</p>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="resetPassword()">Forgot Password?</button>

  <div id="message"></div>
</div>

<script>

const SUPABASE_URL = "https://ozjugaedukcztmywtexk.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_gt5x7FBVniSzvvw5IXilQg_KDrymtJE";

async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Logging in...";

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=password",
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:email,
        password:password
      })
    }
  );

  const data = await response.json();

  if(response.ok){
    localStorage.setItem("admin_session", JSON.stringify(data));
    message.textContent = "Login successful!";
    window.location.href = "admin-dashboard.html";
  }else{
    message.textContent = data.error_description || "Login failed";
  }
}


async function resetPassword(){

  const email = document.getElementById("email").value;
  const message = document.getElementById("message");

  if(!email){
    message.textContent = "Please enter your admin email first.";
    return;
  }

  message.textContent = "Sending reset email...";

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/recover",
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:email,
        redirect_to:"https://mrcrowsensei.vercel.app/update-password.html"
      })
    }
  );

  if(response.ok){
    message.textContent = "Password reset email sent!";
  }else{
    const data = await response.json();
    message.textContent = data.msg || data.error_description || "Reset failed";
  }
}

</script>

</body>
</html>
