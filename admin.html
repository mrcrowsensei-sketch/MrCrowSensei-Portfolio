<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr CrowSensei - Admin</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  width:90%;
  max-width:400px;
  padding:30px;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  box-sizing:border-box;
}

h1{
  text-align:center;
  margin-top:0;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

#message{
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">
  <h1>Mr CrowSensei</h1>
  <p style="text-align:center;">Admin Login</p>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="resetPassword()">Forgot Password?</button>

  <div id="message"></div>
</div>

<<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ozjugaedukcztmywtexk.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_gt5x7FBVniSzvvw5IXilQg_KDrymtJE";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Logging in...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    message.textContent = error.message;
    return;
  }

  localStorage.setItem("admin_session", JSON.stringify(data));

  message.textContent = "Login successful!";

  window.location.href = "admin-dashboard.html";
}

async function resetPassword(){

  const email = document.getElementById("email").value;
  const message = document.getElementById("message");

  if(!email){
    message.textContent = "Please enter your admin email first.";
    return;
  }

  message.textContent = "Sending reset email...";

  const { error } = await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:
        "https://mrcrowsensei.vercel.app/update-password.html"
    }
  );

  if(error){
    message.textContent = error.message;
    return;
  }

  message.textContent = "Password reset email sent!";
}

</script>
</body>
</html>
