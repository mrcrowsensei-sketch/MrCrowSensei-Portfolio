<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Mr CrowSensei</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: #151515;
      border-radius: 15px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Set New Password</h1>

    <input id="password" type="password" placeholder="New password">
    <input id="confirmPassword" type="password" placeholder="Confirm password">

    <button id="updatePassword">Update Password</button>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ozjugaedukcztmywtexk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gt5x7FBVniSzvvw5IXilQg_KDrymtJE";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.getElementById("updatePassword").addEventListener("click", async () => {

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (!password || !confirmPassword) {
        message.textContent = "Please enter both passwords.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Password updated successfully!";

      setTimeout(() => {
        window.location.href = "/";
      }, 1500);
    });
  </script>

</body>
</html>
