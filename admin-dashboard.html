<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 20px;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#080808;
  z-index:10;
}

header h2{
  margin:0;
  font-size:20px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

h3{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-bottom:6px;
}

input,
textarea{
  width:100%;
  padding:12px;
  background:#181818;
  color:#fff;
  border:1px solid #333;
  border-radius:9px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.save{
  background:#fff;
  color:#000;
}

.add{
  background:#22c55e;
  color:#000;
}

.delete{
  background:#ef4444;
  color:#fff;
}

.move{
  background:#292929;
  color:#fff;
}

.edit{
  background:#3b82f6;
  color:#fff;
}

.logout{
  background:#ef4444;
  color:#fff;
  width:100%;
  margin:10px 0 30px;
}

.item{
  background:#181818;
  border:1px solid #292929;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
}

.item img{
  width:80px;
  height:55px;
  object-fit:cover;
  border-radius:7px;
  vertical-align:middle;
  margin-right:10px;
}

.actions{
  margin-top:8px;
}

.msg{
  color:#8cffaa;
  margin-top:10px;
}

.error{
  color:#ff7777;
  margin-top:10px;
}

.stat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.statbox{
  background:#181818;
  border:1px solid #292929;
  padding:18px;
  border-radius:10px;
  text-align:center;
}

.statbox b{
  font-size:24px;
  display:block;
}

.colorbox{
  display:flex;
  gap:8px;
  align-items:center;
}

.colorbox input[type="color"]{
  width:55px;
  height:45px;
  padding:3px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .stat{
    grid-template-columns:1fr;
  }

  main{
    padding:12px;
  }

}

</style>

<script>

const SUPABASE_URL = "https://ozjugaedukcztmywtexk.supabase.co";

const supabaseClient = supabase.createClient(

/* =========================================================
   HELPERS
   ========================================================= */

function setValue(id,value){

  const el=document.getElementById(id);

  if(el){
    el.value=value ?? "";
  }

}


function getValue(id){

  const el=document.getElementById(id);

  return el ? el.value.trim() : "";

}


function message(id,text,error=false){

  const el=document.getElementById(id);

  if(!el) return;

  el.textContent=text;

  el.className=
    error
    ? "error"
    : "msg";

}


/* =========================================================
   SESSION
   ========================================================= */

async function checkSession(){

  const {data,error}=
    await supabaseClient.auth.getSession();


  if(error || !data.session){

    window.location.href="admin.html";

    return false;

  }


  return true;

}


/* =========================================================
   SITE SETTINGS
   ========================================================= */

let settingsId=null;


const defaultSettings={

  id:1,

  header_name:"Mr CrowSensei",

  logo_url:"",

  new_design_text:"New Design Available",

  hero_title:"Professional Minecraft Thumbnails",

  hero_subtitle:"Professional Crafted for Creators",

  crafted_text:"Crafted for Creators",

  stats_thumbnails:"100+",

  stats_creators:"50+",

  stats_years:"2+",

  about_text:"",

  discord_url:"",

  twitter_url:"",

  contact_title:"Let's Work Together",

  contact_text:"",

  bg_color:"#080808",

  bg_gradient_1:"#080808",

  bg_gradient_2:"#151515",

  primary_color:"#ffffff",

  text_color:"#ffffff",

  muted_color:"#999999",

  card_color:"#111111",

  border_color:"#292929",

  button_color:"#ffffff",

  button_text_color:"#000000",

  accent_color:"#ff0000"

};


async function loadSettings(){

  const {data,error}=
    await supabaseClient
      .from("site_settings")
      .select("*")
      .order("id",{ascending:true})
      .limit(1)
      .maybeSingle();


  if(error){

    message(
      "settingsMsg",
      error.message,
      true
    );

    return;

  }


  if(data){

    settingsId=data.id;


    Object.keys(defaultSettings)
      .forEach(key=>{

        if(key!=="id"){

          setValue(
            key,
            data[key]
          );

        }

      });


    setupColorInputs();

    return;

  }


  const {data:newData,error:insertError}=
    await supabaseClient
      .from("site_settings")
      .insert(defaultSettings)
      .select()
      .single();


  if(insertError){

    message(
      "settingsMsg",
      insertError.message,
      true
    );

    return;

  }


  settingsId=newData.id;


  Object.keys(defaultSettings)
    .forEach(key=>{

      if(key!=="id"){

        setValue(
          key,
          newData[key]
        );

      }

    });


  setupColorInputs();

}


async function saveSettings(){

  if(!settingsId){

    message(
      "settingsMsg",
      "Settings row not found.",
      true
    );

    return;

  }


  const payload={

    header_name:
      getValue("header_name"),

    logo_url:
      getValue("logo_url"),

    new_design_text:
      getValue("new_design_text"),

    hero_title:
      getValue("hero_title"),

    hero_subtitle:
      getValue("hero_subtitle"),

    crafted_text:
      getValue("crafted_text"),

    stats_thumbnails:
      getValue("stats_thumbnails"),

    stats_creators:
      getValue("stats_creators"),

    stats_years:
      getValue("stats_years"),

    about_text:
      getValue("about_text"),

    discord_url:
      getValue("discord_url"),

    twitter_url:
      getValue("twitter_url"),

    contact_title:
      getValue("contact_title"),

    contact_text:
      getValue("contact_text")

  };


  const {error}=
    await supabaseClient
      .from("site_settings")
      .update(payload)
      .eq("id",settingsId);


  if(error){

    message(
      "settingsMsg",
      error.message,
      true
    );

    return;

  }


  message(
    "settingsMsg",
    "✅ Website settings saved!"
  );

}


/* =========================================================
   COLORS
   ========================================================= */

const colorFields=[

  "bg_color",

  "bg_gradient_1",

  "bg_gradient_2",

  "primary_color",

  "text_color",

  "muted_color",

  "card_color",

  "border_color",

  "button_color",

  "button_text_color",

  "accent_color"

];


function setupColorInputs(){

  colorFields.forEach(name=>{

    const picker=
      document.getElementById(name);

    const text=
      document.getElementById(
        name+"_text"
      );


    if(!picker || !text)
      return;


    let value=
      getValue(name);


    if(
      !/^#[0-9A-Fa-f]{6}$/.test(value)
    ){

      value="#000000";

      setValue(
        name,
        value
      );

    }


    picker.value=value;

    text.value=value;


    picker.oninput=()=>{

      text.value=
        picker.value;

    };


    text.oninput=()=>{

      if(
        /^#[0-9A-Fa-f]{6}$/.test(
          text.value
        )
      ){

        picker.value=
          text.value;

      }

    };

  });

}


async function saveTheme(){

  if(!settingsId){

    message(
      "themeMsg",
      "Settings not loaded.",
      true
    );

    return;

  }


  const payload={};


  colorFields.forEach(name=>{

    payload[name]=
      getValue(name+"_text") ||
      getValue(name);

  });


  const {error}=
    await supabaseClient
      .from("site_settings")
      .update(payload)
      .eq("id",settingsId);


  if(error){

    message(
      "themeMsg",
      error.message,
      true
    );

    return;

  }


  message(
    "themeMsg",
    "✅ Theme saved!"
  );

}


/* =========================================================
   ORDER FIX
   ========================================================= */

async function normalizeOrders(
  table,
  rows
){

  for(
    let i=0;
    i<rows.length;
    i++
  ){

    if(
      Number(
        rows[i].display_order ?? 0
      ) !== i
    ){

      await supabaseClient
        .from(table)
        .update({
          display_order:i
        })
        .eq(
          "id",
          rows[i].id
        );

    }

  }

}


/* =========================================================
   CREATORS
   ========================================================= */

async function loadCreators(){

  const {data,error}=
    await supabaseClient
      .from("creators")
      .select("*")
      .order(
        "display_order",
        {ascending:true}
      )
      .order(
        "id",
        {ascending:true}
      );


  if(error){

    document.getElementById(
      "creatorList"
    ).textContent=
      error.message;

    return;

  }


  await normalizeOrders(
    "creators",
    data || []
  );


  document.getElementById(
    "creatorCount"
  ).textContent=
    (data || []).length;


  if(
    !data ||
    data.length===0
  ){

    document.getElementById(
      "creatorList"
    ).innerHTML=
      "<p>No creators yet.</p>";

    return;

  }


  const list=
    document.getElementById(
      "creatorList"
    );


  list.innerHTML="";


  data.forEach((c,i)=>{

    const div=
      document.createElement(
        "div"
      );

    div.className="item";


    if(c.image_url){

      const img=
        document.createElement(
          "img"
        );

      img.src=
        c.image_url;

      img.onerror=()=>{
        img.style.display="none";
      };

      div.appendChild(img);

    }


    const name=
      document.createElement(
        "b"
      );

    name.textContent=
      c.name || "";

    div.appendChild(name);


    const subs=
      document.createElement(
        "div"
      );

    subs.style.color="#aaa";

    subs.style.marginTop="5px";

    subs.textContent=
      c.subscribers || "";

    div.appendChild(subs);


    const actions=
      document.createElement(
        "div"
      );

    actions.className="actions";


    if(i>0){

      const up=
        document.createElement(
          "button"
        );

      up.className="move";

      up.textContent="⬆ Up";

      up.onclick=()=>{

        moveCreator(
          i,
          i-1
        );

      };

      actions.appendChild(up);

    }


    if(
      i <
      data.length-1
    ){

      const down=
        document.createElement(
          "button"
        );

      down.className="move";

      down.textContent="⬇ Down";

      down.onclick=()=>{

        moveCreator(
          i,
          i+1
        );

      };

      actions.appendChild(down);

    }


    const edit=
      document.createElement(
        "button"
      );

    edit.className="edit";

    edit.textContent="✏️ Edit";

    edit.onclick=()=>{

      editCreator(c);

    };

    actions.appendChild(edit);


    const del=
      document.createElement(
        "button"
      );

    del.className="delete";

    del.textContent="🗑 Delete";

    del.onclick=()=>{

      deleteCreator(c.id);

    };

    actions.appendChild(del);


    div.appendChild(actions);

    list.appendChild(div);

  });

}


async function saveCreator(){

  const id=
    getValue("creator_id");


  const payload={

    name:
      getValue(
        "creator_name"
      ),

    subscribers:
      getValue(
        "creator_subscribers"
      ),

    image_url:
      getValue(
        "creator_image_url"
      ),

    youtube_url:
      getValue(
        "creator_youtube_url"
      )

  };


  if(!payload.name){

    message(
      "creatorMsg",
      "Enter creator name.",
      true
    );

    return;

  }


  if(id){

    const {error}=
      await supabaseClient
        .from("creators")
        .update(payload)
        .eq("id",id);


    if(error){

      message(
        "creatorMsg",
        error.message,
        true
      );

      return;

    }


    message(
      "creatorMsg",
      "✅ Creator updated!"
    );

  }

  else{

    const {data:existing}=
      await supabaseClient
        .from("creators")
        .select(
          "display_order"
        )
        .order(
          "display_order",
          {ascending:false}
        )
        .limit(1);


    const nextOrder=
      existing &&
      existing.length
      ?
      Number(
        existing[0].display_order || 0
      )+1
      :
      0;


    payload.display_order=
      nextOrder;


    const {error}=
      await supabaseClient
        .from("creators")
        .insert(payload);


    if(error){

      message(
        "creatorMsg",
        error.message,
        true
      );

      return;

    }


    message(
      "creatorMsg",
      "✅ Creator added!"
    );

  }


  clearCreator();

  loadCreators();

}


function editCreator(c){

  setValue(
    "creator_id",
    c.id
  );

  setValue(
    "creator_name",
    c.name
  );

  setValue(
    "creator_subscribers",
    c.subscribers
  );

  setValue(
    "creator_image_url",
    c.image_url
  );

  setValue(
    "creator_youtube_url",
    c.youtube_url
  );


  window.scrollTo({

    top:
      document
        .getElementById(
          "creator_name"
        )
        .getBoundingClientRect()
        .top
      +
      window.scrollY
      -
      100,

    behavior:"smooth"

  });

}


function clearCreator(){

  setValue(
    "creator_id",
    ""
  );

  setValue(
    "creator_name",
    ""
  );

  setValue(
    "creator_subscribers",
    ""
  );

  setValue(
    "creator_image_url",
    ""
  );

  setValue(
    "creator_youtube_url",
    ""
  );

}


async function deleteCreator(id){

  if(
    !confirm(
      "Delete this creator?"
    )
  )
    return;


  const {error}=
    await supabaseClient
      .from("creators")
      .delete()
      .eq("id",id);


  if(error){

    message(
      "creatorMsg",
      error.message,
      true
    );

    return;

  }


  message(
    "creatorMsg",
    "✅ Creator deleted!"
  );


  loadCreators();

}


async function moveCreator(
  index,
  targetIndex
){

  const {data,error}=
    await supabaseClient
