<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr CrowSensei Admin</title>

<style>
body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:20px;
  border-bottom:1px solid #222;
}

main{
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
}

button{
  padding:11px 16px;
  margin:5px 4px 0 0;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.add{
  background:white;
  color:black;
}

.move{
  background:#292929;
  color:white;
}

.delete{
  background:#ff4444;
  color:white;
}

.logout{
  background:#333;
  color:white;
}

.item{
  border-top:1px solid #292929;
  padding:18px 0;
  margin-top:15px;
}

.item img{
  width:100%;
  max-width:300px;
  border-radius:10px;
  display:block;
  margin-bottom:10px;
}

.item-title{
  margin:0 0 8px;
}

#message{
  margin-top:15px;
}
</style>
</head>

<body>

<header>
  <h2>Mr CrowSensei — Admin Panel</h2>
</header>

<main>

<div class="card">
  <h3>📊 Dashboard</h3>
  <p>Total Portfolio Thumbnails: <b id="count">0</b></p>
</div>

<div class="card">
  <h3>🖼️ Add Portfolio Thumbnail</h3>

  <input
    id="title"
    type="text"
    placeholder="Thumbnail title"
  >

  <input
    id="image_url"
    type="url"
    placeholder="Image URL"
  >

  <button class="add" onclick="addPortfolio()">
    Add Thumbnail
  </button>

  <p id="message"></p>
</div>

<div class="card">
  <h3>🖼️ Portfolio</h3>
  <div id="portfolioList">Loading...</div>
</div>

<button class="logout" onclick="logout()">
  Logout
</button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ozjugaedukcztmywtexk.supabase.co";

const SUPABASE_KEY = "sb_publishable_gt5x7FBVniSzvvw5IXilQg_KDrymtJE";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* LOAD PORTFOLIO */

async function loadPortfolio(){

  const list = document.getElementById("portfolioList");
  const count = document.getElementById("count");

  list.textContent = "Loading...";

  const { data, error } = await supabaseClient
    .from("portfolio")
    .select("*")
    .order("display_order", { ascending:true })
    .order("id", { ascending:true });

  if(error){

    list.textContent = error.message;

    return;
  }

  count.textContent = data.length;

  if(data.length === 0){

    list.textContent = "No thumbnails added yet.";

    return;
  }

  list.innerHTML = "";


  data.forEach((item,index)=>{

    const div = document.createElement("div");

    div.className = "item";


    /* TITLE */

    const title = document.createElement("h4");

    title.className = "item-title";

    title.textContent =
      (index + 1) + ". " +
      (item.title || "Untitled");


    /* IMAGE */

    const img = document.createElement("img");

    img.src = item.image_url;

    img.alt =
      item.title || "Minecraft Thumbnail";


    div.appendChild(title);

    div.appendChild(img);


    /* UP BUTTON */

    if(index > 0){

      const upButton =
        document.createElement("button");

      upButton.className = "move";

      upButton.textContent = "⬆️ Up";

      upButton.onclick = function(){

        moveThumbnail(
          item,
          data[index - 1]
        );

      };

      div.appendChild(upButton);
    }


    /* DOWN BUTTON */

    if(index < data.length - 1){

      const downButton =
        document.createElement("button");

      downButton.className = "move";

      downButton.textContent = "⬇️ Down";

      downButton.onclick = function(){

        moveThumbnail(
          item,
          data[index + 1]
        );

      };

      div.appendChild(downButton);
    }


    /* DELETE BUTTON */

    const deleteButton =
      document.createElement("button");

    deleteButton.className = "delete";

    deleteButton.textContent = "🗑️ Delete";

    deleteButton.onclick = function(){

      deletePortfolio(item.id);

    };

    div.appendChild(deleteButton);


    list.appendChild(div);

  });

}


/* ADD PORTFOLIO */

async function addPortfolio(){

  const title =
    document.getElementById("title")
      .value.trim();

  const image_url =
    document.getElementById("image_url")
      .value.trim();

  const message =
    document.getElementById("message");


  if(!title || !image_url){

    message.textContent =
      "Please enter title and image URL.";

    return;
  }


  message.textContent =
    "Adding thumbnail...";


  /* FIND LAST ORDER */

  const { data: existing, error: orderError } =
    await supabaseClient
      .from("portfolio")
      .select("display_order")
      .order("display_order", {
        ascending:false
      })
      .limit(1);


  if(orderError){

    message.textContent =
      orderError.message;

    return;
  }


  let nextOrder = 0;


  if(existing && existing.length > 0){

    nextOrder =
      Number(
        existing[0].display_order || 0
      ) + 1;

  }


  /* INSERT */

  const { error } =
    await supabaseClient
      .from("portfolio")
      .insert({

        title:title,

        image_url:image_url,

        display_order:nextOrder

      });


  if(error){

    message.textContent =
      error.message;

    return;
  }


  message.textContent =
    "Thumbnail added successfully!";


  document.getElementById("title").value = "";

  document.getElementById("image_url").value = "";


  loadPortfolio();

}


/* MOVE THUMBNAIL */

async function moveThumbnail(current,other){

  const currentOrder =
    current.display_order;

  const otherOrder =
    other.display_order;


  /* CURRENT → OTHER POSITION */

  const { error:error1 } =
    await supabaseClient
      .from("portfolio")
      .update({

        display_order:otherOrder

      })
      .eq("id",current.id);


  if(error1){

    alert(error1.message);

    return;
  }


  /* OTHER → CURRENT POSITION */

  const { error:error2 } =
    await supabaseClient
      .from("portfolio")
      .update({

        display_order:currentOrder

      })
      .eq("id",other.id);


  if(error2){

    alert(error2.message);

    return;
  }


  loadPortfolio();

}


/* DELETE */

async function deletePortfolio(id){

  if(!confirm(
    "Delete this thumbnail?"
  )){

    return;
  }


  const { error } =
    await supabaseClient
      .from("portfolio")
      .delete()
      .eq("id",id);


  if(error){

    alert(error.message);

    return;
  }


  loadPortfolio();

}


/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();

  localStorage.removeItem(
    "admin_session"
  );

  window.location.href =
    "admin.html";

}


/* START */

loadPortfolio();

</script>

</body>
</html>
