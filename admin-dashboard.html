<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr CrowSensei Admin</title>

<style>
body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  border-bottom:1px solid #222;
}
main{
  padding:20px;
  max-width:900px;
  margin:auto;
}
.card{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}
button{
  padding:12px 18px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h2>Mr CrowSensei — Admin Panel</h2>
</header>

<main>

<div class="card">
  <h3>📊 Dashboard</h3>
  <p>Welcome to your portfolio admin panel.</p>
</div>

<div class="card">
  <h3>🖼 Portfolio</h3>
  <p>Thumbnail management will be added here.</p>
</div>

<div class="card">
  <h3>👤 Trusted Creators</h3>
  <p>Creator management will be added here.</p>
</div>

<div class="card">
  <h3>⚙️ Website Settings</h3>
  <p>Website settings will be added here.</p>
</div>

<button onclick="logout()">Logout</button>

</main>

<script>
function logout(){
  localStorage.removeItem("admin_session");
  window.location.href="admin.html";
}
</script>

</body>
</html>
